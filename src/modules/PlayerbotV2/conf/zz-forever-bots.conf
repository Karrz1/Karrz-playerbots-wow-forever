[worldserver]
###################################################################################################
# WoW Forever Bots - DEFAULT SETTINGS
# The bots build puts this file into worldserver.conf.d\ if it is not there yet (an existing copy is never overwritten).
# It is read after playerbot.conf, so it wins. Edit the values and restart; delete the file to go back to the stock defaults
# (then no world bots and no auction house bot run). The raid and instance shortcuts below are commented out because they
# change core gameplay; remove the leading # to use them.

###################################################################################################
# Raids and instances (core keys, all off: not Blizzlike)
###################################################################################################
# Not Blizzlike: a solo player may enter a raid (no 40-player raid group needed), so you can walk in and call bots inside.
# Instance.IgnoreRaid = 1
# Vanilla lockout rule: you are saved to the raid on entry.
# Instance.BindOnEntry = 1
# Killed raid trash stays dead after you leave and come back (it does not respawn until the weekly reset).
# Instance.PersistRaidTrash = 1
# Molten Core: Majordomo and Ragnaros are up without dousing the runes.
# Instance.MoltenCoreSkipRunes = 1
# No attunement item or quest is needed to enter a raid.
# Instance.IgnoreAttunement = 1
# The Gates of Ahn'Qiraj start open.
# Instance.AhnQirajGatesOpen = 1
# Stock value (0), listed so you can see it: Molten Core core hound packs are unlinked by default, so they die one by one. See doc/OptionalServerOptions.md.
# Instance.MoltenCoreHoundsLinked = 0

###################################################################################################
# Auction house bot (core keys): fills all three houses with level 1-60 vanilla items, buys listings
###################################################################################################
AuctionHouseBot.Seller.Enabled = 1
# One shared (neutral) auction house: the neutral buyer buys what you list; the faction buyers are off.
AuctionHouseBot.Buyer.Alliance.Enabled = 0
AuctionHouseBot.Buyer.Horde.Enabled = 0
AuctionHouseBot.Buyer.Neutral.Enabled = 1
# Reserved account id for the seller characters (no real account; keep it below 2147483647).
AuctionHouseBot.Account = 2000000001
AuctionHouseBot.Sellers.Count = 12
AuctionHouseBot.Vanilla.Only = 1
AuctionHouseBot.Vanilla.MaxReqLevel = 60
AuctionHouseBot.Vanilla.MaxItemLevel = 100
AuctionHouseBot.Items.Amount.White = 3500
AuctionHouseBot.Items.Amount.Green = 3500
AuctionHouseBot.Items.Amount.Blue = 1200
AuctionHouseBot.Items.Amount.Purple = 250
AuctionHouseBot.Items.Vendor = 1
AuctionHouseBot.Class.TradeGood = 10
AuctionHouseBot.Class.Consumable = 8
AuctionHouseBot.Class.Recipe = 6
AuctionHouseBot.Class.Container = 5
AuctionHouseBot.Class.Weapon = 4
AuctionHouseBot.Class.Armor = 4
AuctionHouseBot.Class.Reagent = 2
AuctionHouseBot.Class.Projectile = 3
AuctionHouseBot.Class.Misc = 2
AuctionHouseBot.Class.Quest = 0
AuctionHouseBot.Class.Key = 0
AuctionHouseBot.Class.Gem = 0
AuctionHouseBot.Class.Glyph = 0
AuctionHouseBot.Update.Interval = 10
AuctionHouseBot.ItemsPerCycle.Normal = 100

###################################################################################################
# Logging: bot module lines go to Playerbot.log (rewritten at each start), not the console
###################################################################################################
Appender.Playerbot = 2,3,1,Playerbot.log,w
Logger.playerbot.v2 = 3,Playerbot
Logger.playerbot.api = 3,Playerbot
Logger.entities.pet = 3,Playerbot
Logger.ahbot = 3,Console Server

###################################################################################################
# Bots (module keys; every key is documented in playerbot.conf.dist)
###################################################################################################
Playerbot.SharedDatabase = "playerbot"
Playerbot.Raid.Enable = 1

# Off: vanilla cast speed. Set Playerbot.Cast.Enable = 1 to use the percentages below (percent of normal cast time and GCD, GCD never under 750 ms).
Playerbot.Cast.Enable = 0
Playerbot.Cast.RaidSpeedPct = 75
Playerbot.Cast.DungeonSpeedPct = 90
Playerbot.Cast.WorldSpeedPct = 100
Playerbot.Cast.BgSpeedPct = 115
Playerbot.Cast.WorldPvpSpeedPct = 115

# Battleground and duel bots react a little faster than before (floor on their tick while in PvP, 700 -> 630 ms, about 10 per cent harder).
Playerbot.Pacing.PvpReactionDelayMs = 630

# Battlegrounds: bots join only when a real player queues.
Playerbot.Bg.AutoSeed.Matches = 0
Playerbot.Bg.AutoJoin = 0

# World bots, set up like the live test server: a roster of sleeping residents (PoolMax) that wake near real players, so the
# world feels populated. Up to MaxBots are awake at once; each player gets about BotsPerPlayer around them (CityBots in a
# capital or town, ZoneBots in a leveling zone), and residents within WakeRadius yards of a player wake up.
# Weak machine? RAM is about 2.9 GB for the server plus about 4 MB per awake bot. For 8 GB use MaxBots 60, for 16 GB MaxBots 100
# with BotsPerPlayer 40, CityBots 40 and ZoneBots 20; the roster itself (PoolMax) costs database rows, not memory.
# To switch the world bots off: Enable = 0.
Playerbot.Population.TotalTarget = 0
Playerbot.World.Enable = 1
Playerbot.World.FriendlyPct = 100
Playerbot.World.GlobalFill = 0
Playerbot.World.MaxBots = 220
Playerbot.World.BotsPerPlayer = 160
Playerbot.World.CityBots = 160
Playerbot.World.ZoneBots = 60
Playerbot.World.ActivityRadius = 600
Playerbot.World.WakeRadius = 450
# Roster of sleeping residents, built up to PoolMax in the background (SeedRoster = 1).
Playerbot.World.PoolMax = 3000
Playerbot.World.SeedRoster = 1
# Part of the roster that is kept as a temporary pool, balanced by faction and level. Only read by builds that have the
# temporary pool; this build ignores it.
Playerbot.World.VariableMax = 2000
Playerbot.World.FillerHubOnly = 1
# The spawner stops adding bots when the worldserver process passes this many MB (0 = no limit).
Playerbot.World.RssBudgetMb = 9000
# Questing of the world's bots. 0 (default): they do not pick up or do quests on their own; they level by killing the mobs of their level
# (walking to where such mobs stand when none is near), stand around inns and flight masters, duel and chat. Companions (bots grouped
# with a player) still quest with him: they accept the quests he shares, do the objectives beside him and hand in with him.
# 1: the old behaviour, world bots walk to quest hubs, take quests and do them.
Playerbot.World.Questing = 0
# Gate duels: pairs of bots duel outside the capital gates while a player is near, bots accept a player's duel request, and now and
# then one asks a player for a duel. Enable = 0 switches all of it off.
Playerbot.World.GateDuels.Enable = 1
Playerbot.World.GateDuels.PairsPerGate = 2
Playerbot.World.GateDuels.Radius = 80
Playerbot.World.GateDuels.ChallengePlayers = 1
Playerbot.World.GateDuels.ChallengeCooldownSec = 600
