###################################################################################################
# WoW Forever Bots - OPTIONAL EXTRAS
# Optional extras, not Blizzlike, only applied if you copy this file in.
# Copy it into worldserver.conf.d\ as zz-forever-bots.conf (it is read after playerbot.conf, so it wins).
# The stock worldserver.conf.dist and playerbot.conf.dist keep every one of these OFF. Delete the file to go back.

###################################################################################################
# Raids and instances (core keys)
###################################################################################################
# Not Blizzlike: a solo player may enter a raid (no 40-player raid group needed), so you can walk in and call bots inside.
Instance.IgnoreRaid = 1
# Vanilla lockout rule: you are saved to the raid on entry.
Instance.BindOnEntry = 1
# Killed raid trash stays dead after you leave and come back (it does not respawn until the weekly reset).
Instance.PersistRaidTrash = 1
# Molten Core: Majordomo and Ragnaros are up without dousing the runes.
Instance.MoltenCoreSkipRunes = 1
# No attunement item or quest is needed to enter a raid.
Instance.IgnoreAttunement = 1
# The Gates of Ahn'Qiraj start open.
Instance.AhnQirajGatesOpen = 1
# Stock value (0), listed so you can see it: Molten Core core hound packs are unlinked by default, so they die one by one. See doc/OptionalServerOptions.md.
Instance.MoltenCoreHoundsLinked = 0

###################################################################################################
# Auction house bot (core keys): fills all three houses with level 1-60 vanilla items, buys listings
###################################################################################################
AuctionHouseBot.Seller.Enabled = 1
AuctionHouseBot.Buyer.Alliance.Enabled = 1
AuctionHouseBot.Buyer.Horde.Enabled = 1
AuctionHouseBot.Buyer.Neutral.Enabled = 1
# Reserved account id for the seller characters (no real account; keep it below 2147483647).
AuctionHouseBot.Account = 2000000001
AuctionHouseBot.Sellers.Count = 12
AuctionHouseBot.Vanilla.Only = 1
AuctionHouseBot.Vanilla.MaxReqLevel = 60
AuctionHouseBot.Vanilla.MaxItemLevel = 100
AuctionHouseBot.Items.Amount.White = 3500
AuctionHouseBot.Items.Amount.Green = 3500
AuctionHouseBot.Items.Amount.Blue = 1200
AuctionHouseBot.Items.Amount.Purple = 250
AuctionHouseBot.Items.Vendor = 1
AuctionHouseBot.Class.TradeGood = 10
AuctionHouseBot.Class.Consumable = 8
AuctionHouseBot.Class.Recipe = 6
AuctionHouseBot.Class.Container = 5
AuctionHouseBot.Class.Weapon = 4
AuctionHouseBot.Class.Armor = 4
AuctionHouseBot.Class.Reagent = 2
AuctionHouseBot.Class.Projectile = 3
AuctionHouseBot.Class.Misc = 2
AuctionHouseBot.Class.Quest = 0
AuctionHouseBot.Class.Key = 0
AuctionHouseBot.Class.Gem = 0
AuctionHouseBot.Class.Glyph = 0
AuctionHouseBot.Update.Interval = 10
AuctionHouseBot.ItemsPerCycle.Normal = 100

###################################################################################################
# Logging: bot module lines go to Playerbot.log (rewritten at each start), not the console
###################################################################################################
Appender.Playerbot = 2,3,0,Playerbot.log,w
Logger.playerbot.v2 = 3,Playerbot
Logger.playerbot.api = 3,Playerbot
Logger.ahbot = 3,Console Server

###################################################################################################
# Bots (module keys; every key is documented in playerbot.conf.dist)
###################################################################################################
Playerbot.SharedDatabase = "playerbot"
Playerbot.Raid.Enable = 1

# Cast speed, percent of normal cast time and GCD (GCD never under 750 ms): quicker in raids, slower in PvP.
Playerbot.Cast.Enable = 1
Playerbot.Cast.RaidSpeedPct = 75
Playerbot.Cast.DungeonSpeedPct = 90
Playerbot.Cast.WorldSpeedPct = 100
Playerbot.Cast.BgSpeedPct = 115
Playerbot.Cast.WorldPvpSpeedPct = 115

# Battlegrounds: bots join only when a real player queues.
Playerbot.Bg.AutoSeed.Matches = 0
Playerbot.Bg.AutoJoin = 0

# World bots, stage A: about 300 bots roaming the world (around 4 GB of RAM for the server).
# Weak machine? Use MaxBots 100 and GlobalFill 0 (bots then only appear around you). To switch off: Enable = 0.
Playerbot.Population.TotalTarget = 0
Playerbot.World.Enable = 1
Playerbot.World.FriendlyPct = 100
Playerbot.World.GlobalFill = 1
Playerbot.World.MaxBots = 300
Playerbot.World.BotsPerPlayer = 60
Playerbot.World.PoolMax = 600
Playerbot.World.FillerHubOnly = 1
# The spawner stops adding bots when the worldserver process passes this many MB (0 = no limit).
Playerbot.World.RssBudgetMb = 6000
